name: Feature Request
description: Propose a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, please check that the proposed feature:
        - Uses only **free, no-API-key** data sources
        - Fits the existing scope (crypto market data, portfolio tools, analytics)

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gap or friction you're experiencing.
      placeholder: I can't quickly see which coins have had the highest volume spikes in the last hour.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see built?
      placeholder: A "Volume Spike" tab on the Markets page, sorted by 1h volume change descending.
    validations:
      required: true

  - type: input
    id: api
    attributes:
      label: Free API source (if applicable)
      description: If this needs new data, what free public API would provide it?
      placeholder: CoinGecko /coins/markets already returns total_volume

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would use regularly
        - Blocking me from using the app
    validations:
      required: true
