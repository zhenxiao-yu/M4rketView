name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          retention-days: 30

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Zip dist
        run: zip -r dist-${{ github.ref_name }}.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: M4rketView ${{ github.ref_name }}
          body: |
            ## M4rketView ${{ github.ref_name }}

            Production crypto market dashboard — live at [m4rket-view.vercel.app](https://m4rket-view.vercel.app)

            See [CHANGELOG](https://github.com/zhenxiao-yu/M4rketView/blob/main/src/components/Footer.tsx#L57) in the footer for detailed changes, or click **v${{ github.ref_name }} — what's new?** in the app footer.

            ### Install & run locally

            ```bash
            git clone https://github.com/zhenxiao-yu/M4rketView.git
            cd M4rketView
            npm install
            npm run dev
            ```

            No `.env` file required — all APIs are free and public.
          files: dist-${{ github.ref_name }}.zip
          generate_release_notes: true
          make_latest: true
